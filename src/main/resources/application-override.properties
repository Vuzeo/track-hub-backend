# Database: never commit credentials. Heroku sets JDBC_DATABASE_* (and SPRING_DATASOURCE_*)
# automatically for an attached Postgres add-on; the defaults below are for local development.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/trackhub}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
spring.jpa.show-sql=false
## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Origins allowed to call the API from a browser (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://track-hub-frontend.herokuapp.com,http://localhost:4200}
